name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # pnpm@latest(11.x)는 Node 22.13+ 가 필요해 러너 기본 Node(20.x)와 충돌하므로,
          # 로컬 개발 환경과 동일한 pnpm 8 계열로 고정 (pnpm-lock.yaml도 lockfileVersion 6.0 = pnpm 8 포맷)
          package-manager: pnpm@8

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
